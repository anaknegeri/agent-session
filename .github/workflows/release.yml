name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        os: [darwin, linux, windows]
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true

      - name: Build
        run: |
          ext=""
          [ "${{ matrix.os }}" = "windows" ] && ext=".exe"
          version="${GITHUB_REF_NAME#v}"
          ldflags="-s -w \
            -X github.com/anaknegeri/agent-session/pkg/version.Version=${version} \
            -X github.com/anaknegeri/agent-session/pkg/version.Commit=${{ github.sha }} \
            -X github.com/anaknegeri/agent-session/pkg/version.Date=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          for bin in agent-session agent-session-mcp; do
            out="${bin}-${{ matrix.os }}-${{ matrix.arch }}${ext}"
            CGO_ENABLED=0 GOOS=${{ matrix.os }} GOARCH=${{ matrix.arch }} \
              go build -trimpath -ldflags "$ldflags" -o "$out" ./cmd/${bin}
          done
          echo "built for ${{ matrix.os }}/${{ matrix.arch }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}-${{ matrix.arch }}
          path: |
            agent-session-${{ matrix.os }}-${{ matrix.arch }}*
            agent-session-mcp-${{ matrix.os }}-${{ matrix.arch }}*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate checksums
        working-directory: artifacts
        run: |
          shasum -a 256 * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
