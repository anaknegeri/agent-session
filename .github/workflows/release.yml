name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        os: [darwin, linux, windows]
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"
          cache: true

      - name: Build
        run: |
          ext=""
          [ "${{ matrix.os }}" = "windows" ] && ext=".exe"
          version="${GITHUB_REF_NAME#v}"
          ldflags="-s -w \
            -X github.com/anaknegeri/agent-session/pkg/version.Version=${version} \
            -X github.com/anaknegeri/agent-session/pkg/version.Commit=${{ github.sha }} \
            -X github.com/anaknegeri/agent-session/pkg/version.Date=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          for bin in agent-session agent-session-mcp; do
            out="${bin}-${{ matrix.os }}-${{ matrix.arch }}${ext}"
            CGO_ENABLED=0 GOOS=${{ matrix.os }} GOARCH=${{ matrix.arch }} \
              go build -trimpath -ldflags "$ldflags" -o "$out" ./cmd/${bin}
          done
          echo "built for ${{ matrix.os }}/${{ matrix.arch }}"

      - uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.os }}-${{ matrix.arch }}
          path: |
            agent-session-${{ matrix.os }}-${{ matrix.arch }}*
            agent-session-mcp-${{ matrix.os }}-${{ matrix.arch }}*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"

      - uses: actions/download-artifact@v5
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate checksums
        working-directory: artifacts
        run: |
          shasum -a 256 * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true

  homebrew:
    needs: release
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"

      - name: Build macOS arm64 bottle
        run: |
          version="${GITHUB_REF_NAME#v}"
          ldflags="-s -w \
            -X github.com/anaknegeri/agent-session/pkg/version.Version=${version} \
            -X github.com/anaknegeri/agent-session/pkg/version.Commit=${{ github.sha }} \
            -X github.com/anaknegeri/agent-session/pkg/version.Date=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          mkdir -p bottle/agent-session/${version}/bin
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 \
            go build -trimpath -ldflags "$ldflags" \
            -o bottle/agent-session/${version}/bin/agent-session ./cmd/agent-session
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 \
            go build -trimpath -ldflags "$ldflags" \
            -o bottle/agent-session/${version}/bin/agent-session-mcp ./cmd/agent-session-mcp
          chmod +x bottle/agent-session/${version}/bin/*
          cd bottle
          tar -czf agent-session-${version}.arm64_golden_gate.bottle.tar.gz agent-session
          shasum -a 256 agent-session-${version}.arm64_golden_gate.bottle.tar.gz

      - name: Upload bottle to release
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release upload "${GITHUB_REF_NAME}" \
            bottle/agent-session-${version}.arm64_golden_gate.bottle.tar.gz --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Regenerate formula and push to tap
        run: |
          bash ./scripts/update-homebrew-formula.sh
          version="${GITHUB_REF_NAME#v}"
          git clone https://github.com/anaknegeri/homebrew-tap.git /tmp/tap
          cp packaging/Homebrew/agent-session.rb /tmp/tap/Formula/
          cd /tmp/tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "bump agent-session to v${version}" || exit 0
          git push
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
